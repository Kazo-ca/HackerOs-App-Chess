name: CI

# Builds the solution and runs every test suite: C# unit tests, the rules module under node, and
# the end-to-end runs of the app inside the HackerOS host (Playwright, Chromium).
# Pushes to the integration branches, and every PR (work items are pushed and tested through
# their PR, so a work-item push does not run twice).
on:
  push:
    branches: [main, "chess/base"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Build
        run: dotnet build Kazo.Chess.slnx

      - name: C# unit tests
        run: dotnet test tests/Kazo.Chess.Tests --no-build

      - name: Install JavaScript test tools
        run: npm ci

      - name: Rules module tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
